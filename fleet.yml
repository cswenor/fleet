# Host binding for the fleet installation; credentials live only in private EnvironmentFile.
version: 1
repo: cswenor/fleet
root: /home/dev/dev/cswenor/fleet
orca_repo_id: 2d192998-c4ff-4ae1-92fe-8cd901e27f86
pad_workspace: fleet
orca: /home/dev/.config/orca/cli/bin/orca
builder:
  model: openai-codex/gpt-6.1-sol
  resolved_model: openai-codex/gpt-6.1-sol
  thinking: medium
  max: 2
  slots:
  - /home/dev/orca/workspaces/fleet/fleet-phase1
  - /home/dev/orca/workspaces/fleet/fleet-lane2
  rules_file: .omp/AGENTS.md
  idle_seconds: 2700
  ready_report_minutes: 15 # Positive finite minutes; nonurgent missing-ready fallback.
  footer: |
    Self-publish small PRs after a fresh independent read-only unadvised Sol
    review and green CI (no fleet review bot). While you own an open PR, MUST keep
    fleet watch-pr PR armed as an async background command. Process each event and
    re-arm after every completion (including timeout/error) until merged or closed.
    Never rely on retired pr-wait.sh scripts or single-workflow gh run watch alone;
    never poll with model turns. This session is already fresh for its assigned task;
    never signal FRESH-READY for an inherited handoff. Pick the next piece by plan
    priority, usually the same feature; the same ref is allowed. Never switch to
    an unrelated task just to get a different ref. Only after publishing your NEXT
    piece of work (merged after your launch) and writing its concrete next-piece
    handoff after that merge, settle the primary thread with fleet --config CONFIG
    thread result REF. Then make fleet --config CONFIG thread ready NEXT [--body TEXT]
    your last lane action and stop. Use the same config as thread open, never raw
    orca send for FRESH-READY. Same-ref readiness needs the newer merge and later
    concrete handoff on that ref; Pad done alone is insufficient. Main approves
    the fresh launch. Never resume old context, silently fallback, create extra
    worktrees, stash, or spend saved resets without owner approval.
    Ready sends a native question for Main's launch ruling; Main replies in-thread.
    Stop after sending without waiting for that reply; never resend an existing receipt.
    On PARK finish the current step, commit and push WIP, write a Pad handoff,
    report PARKED to the configured Run, then stop yourself; resume requires
    a Main-confirmed fresh session.
    Decision requests use EXACTLY ONE channel: fleet thread question. It sends
    the native type question to run:<coordinator.run> itself; never also send a
    direct orca send/ask/question for the same decision. Follow-ups use reply/status
    in the same pending native subthread, not a new direct question.
    Ordinary progress/PARK reports may still raw-send with --type status.
    If Main authorizes continuing after thread result, run fleet --config CONFIG
    thread reopen REF --authorized-by MSG_ID before any new question; never fall
    back to direct Run questions. Use the same config as thread open.
    Never bind a builder terminal to any Run.
quota:
  provider: openai-codex
  reserve_percent: 10
  max_age_seconds: 900
  park_timeout_seconds: 1800
disk:
  path: /
  min_free_gb: 20
coordinator:
  terminal: term_b69e32e9-2ad2-4e9d-8ea2-419f2ee94c00
  run: run_ca3dd4d80c5a
interval_seconds: 60
status:
  url: https://central.example.ts.net:8443/snapshots
  token_env: FLEET_SELF_TOKEN
  push_seconds: 300
hooks: {}
