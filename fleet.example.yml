version: 1
repo: owner/project
root: /path/to/project
orca_repo_id: replace-with-orca-repo-id
pad_workspace: project
# Usually derived from `pad collection list` task status schema. Optional complete override:
# pad:
#   statuses:
#     not_started: [open]
#     in_progress: [in-progress]
#     terminal: [done, cancelled]
orca: /absolute/path/to/orca-ide
builder:
  model: openai-codex/gpt-6.1-sol
  resolved_model: openai-codex/gpt-6.1-sol
  thinking: medium
  max: 2
  slots:
    - /path/to/slot-a
    - /path/to/slot-b
  # Adopt templates/AGENTS.decision-rights.md here; fill project/Main/review bindings.
  rules_file: AGENTS.md
  idle_seconds: 2700
  footer: |
    Self-publish small PRs and resolve task-caused CI failures.
    Never poll with model turns; use fleet watch-pr as an async background command.
    This session is already fresh for the assigned task. Do not signal FRESH-READY
    for an inherited handoff or boundary. Only after publishing your next piece
    of work, choose a different next task, write its handoff, report FRESH-READY
    with that different task ref to the coordinator, and stop.
    On PARK: finish current step, commit+push WIP, write Pad handoff, report PARKED
    to the configured Run, then stop yourself. Resume only as a confirmed fresh session.
    Decision requests MUST use --type question to run:<coordinator.run>;
    reports use --type status. Never bind a builder terminal to any Run.
quota:
  provider: openai-codex
  reserve_percent: 10
  max_age_seconds: 900
  unknown_alert_cycles: 3 # Consecutive unknown cycles before alerting; starts remain withheld.
  park_timeout_seconds: 1800
disk:
  path: /
  min_free_gb: 20
coordinator:
  terminal: term_replace
  run: run_replace
interval_seconds: 60
status:
  url: ''
  token_env: FLEET_STATUS_TOKEN
  push_seconds: 300
hooks: {}
