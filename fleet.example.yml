version: 1
repo: owner/project
root: /path/to/project
orca_repo_id: replace-with-orca-repo-id
pad_workspace: project
# Usually derived from `pad collection list` task status schema. Optional complete override:
# pad:
#   statuses:
#     not_started: [open]
#     in_progress: [in-progress]
#     terminal: [done, cancelled]
orca: /absolute/path/to/orca-ide
builder:
  model: openai-codex/gpt-6.1-sol
  resolved_model: openai-codex/gpt-6.1-sol
  thinking: medium
  # Optional resolved model -> allowed thinking levels. Default pair is implicit.
  allowed_models: {}
  # Nearest Pad PLAN only; no fallback to a mapped outer plan.
  # Every nondefault pair must be in allowed_models.
  # plan_models:
  #   PLAN-32: {model: anthropic/claude-fable-5-2, thinking: xhigh}
  # allowed_models:
  #   anthropic/claude-fable-5-2: [xhigh]
  plan_models: {}
  max: 2
  slots:
    - /path/to/slot-a
    - /path/to/slot-b
  # Adopt templates/AGENTS.decision-rights.md here; fill project/Main/review bindings.
  rules_file: AGENTS.md
  idle_seconds: 2700
  # Positive integer; consecutive absent health cycles before recurrence re-alerts.
  alert_recovery_cycles: 2
  # Positive finite minutes without durable session events (not spinner output).
  stall_minutes: 60
  stall_after_ci_minutes: 20
  # Positive finite minutes; nonurgent missing-ready fallback, once per launch.
  ready_report_minutes: 15
  footer: |
    Self-publish small PRs and resolve task-caused CI failures.
    While you own an open PR, MUST keep fleet watch-pr PR armed as an async
    background command. Process each event and re-arm after every completion
    (including timeout/error) until merged or closed. Never rely on retired
    pr-wait.sh scripts or single-workflow gh run watch alone; no model-turn polling.
    This session is already fresh for the assigned task. Do not signal FRESH-READY
    for an inherited handoff or boundary. Pick the next piece by plan priority,
    usually the same feature; the same ref is allowed. Never switch to an unrelated
    task just to get a different ref. Only after publishing your NEXT piece of work
    (merged after your launch) and writing its concrete next-piece handoff after
    that merge, settle the primary thread with fleet --config CONFIG thread result REF.
    Then make fleet --config CONFIG thread ready NEXT [--body TEXT] your last lane
    action and stop. Use the same config as thread open, never raw orca send for
    FRESH-READY. Same-ref readiness needs the newer merge and later concrete
    handoff on that ref; Pad done alone is insufficient. Main approves the fresh launch.
    Ready sends a native question for Main's launch ruling; Main replies in-thread.
    Stop after sending without waiting for that reply; never resend an existing receipt.
    If complete without a concrete next ref, settle thread result, then make
    fleet --config CONFIG thread needs-next REF the last lane action and end the turn.
    On PARK finish the step, commit/push WIP, write a Pad resume comment, then make
    fleet --config CONFIG thread parked REF --resume-note COMMENT_ID the last lane action.
    This verifies clean pushed WIP and settles park completion for Main's guarded
    different-ref reassignment. Resume requires a Main-confirmed fresh session.
    After reporting PARKED or successfully sending thread ready, end your turn with
    a final message and do nothing else: no further tool calls, no background jobs,
    and never a job that waits on your own terminal/idle state or sends input to
    your own terminal. Main (or the owner) retires the idle session via the documented
    retirement path (fleet restart for eligible finished work, or manual idle-proof
    /exit + fleet reconcile).
    Decision requests use EXACTLY ONE channel: fleet thread question. It sends
    the native type question to run:<coordinator.run> itself; never also send a
    direct orca send/ask/question for the same decision. Follow-ups use reply/status
    in the same pending native subthread, not a new direct question.
    After recording a pending decision and finishing unaffected work, you may end
    your turn. With delivery and builder_wake enabled, Fleet wakes your proven-idle
    pane when Main replies. On wake run thread check, then thread wait with the
    original --config to read/record the decision before continuing.
    Ordinary progress/PARK reports may still raw-send with --type status.
    If Main authorizes continuing after thread result, run fleet --config CONFIG
    thread reopen REF --authorized-by MSG_ID before any new question; never fall
    back to direct Run questions. Use the same config as thread open.
    Never bind a builder terminal to any Run.
quota:
  # Provider follows the selected per-launch resolved model, never the reviewer.
  reserve_percent: 10
  max_age_seconds: 900
  unknown_alert_cycles: 3 # Consecutive unknown cycles before alerting; starts remain withheld.
  park_timeout_seconds: 1800
disk:
  path: /
  min_free_gb: 20
coordinator:
  terminal: term_replace
  run: run_replace
  # Main-owned scratch paths only; absolute fnmatch globs, [] by default.
  # Matches remain visible and relay once as status, never urgent.
  expected_worktree_globs: []
  # Positive finite minutes of observed shell/crash before main_down.
  liveness_minutes: 5
  # Consecutive unknown observations before nonurgent main_unknown.
  unknown_alert_cycles: 3
  # Only own-Run actionable unread mail + idle OMP + empty composer permits input.
  wake: true
  # Native reply to a pending builder question + exact idle launch proof only.
  builder_wake: true
  wake_after_seconds: 120
  wake_cooldown_seconds: 600
  # Relay unsafe/unknown Main proof only after this actionable unread age.
  unwakeable_after_seconds: 900
  # Optional additional Run ID receiving Main liveness alerts, not a terminal.
  escalation_run: null
interval_seconds: 60
github:
  # Case-insensitive names; [] disables label exclusion, never draft exclusion.
  parked_labels: [parked]
publication:
  # manual preserves existing prompts/self-publication; release is ignored.
  mode: manual
  # auto_merge arming: main requires exact-head Main RELEASE (default).
  # none: builder arms immediately after independent final-head PASS posted on PR,
  # before CI/App completion; GitHub still enforces exact-head App approval,
  # required checks and App-owned app-approval. No bypass; builder never changes hold.
  # Before any push after arming: disarm/dequeue and verify removal, then push,
  # obtain/post new exact-head PASS and rearm (main also needs fresh RELEASE).
  # Record arming actor; watch until actual merge/close, not just queue entry.
  # Owner/Main stop: hold plus disarm/dequeue with verified removal.
  # Arm ONLY through: fleet --config CONFIG review-bot arm N --head FULL_SHA
  # auto_merge requires review_bot receipts + a live-verified no-bypass ruleset.
  # Operator gh auth must expose bypass_actors; Builder has no administration.
  release: main # main | none
  # Required App slug in auto_merge; not a check name or human reviewer login.
  review_app: ''
  hold_label: hold
  merge_method: squash # merge | squash | rebase
# Optional Review Bot bootstrap; keep publication manual until init activates it.
# Copy source {repository, version, commit, image} from a verified release.json;
# never use a mutable image tag or invent App/installation receipts.
# review_bot:
#   apps:
#     owner: owner # must match repo owner
#     owner_type: organization # organization | user
#     review:
#       name: project-fleet-review # owner chooses globally unique App names
#       env_file: /home/fleet/.config/fleet/project/review-app.env
#     builder:
#       name: project-fleet-builder
#       env_file: /home/fleet/.config/fleet/project/builder-app.env
#   webhook_url: https://review.example.invalid/github # replace with approved public HTTPS ingress
#   ruleset:
#     name: fleet-review-bot
#     branch: main
#     required_checks: [] # configure real project CI contexts + producer integration_id
#     merge_queue: false # true or parameter mapping; CI must trigger on merge_group (docs/MAIN.md)
#   deployment:
#     backend: compose
#     mode: advisory # approve requires verified live main ruleset on every apply
#     docker_context: project-review-host # explicit existing local or SSH context
#     directory: /srv/fleet-review/project # TARGET-host root; owner prepares its subdirs
#     runner_config_dir: /etc/fleet-review/project # TARGET-host read-only model policy
#     broker_auth_dir: /srv/fleet-review-auth/project # TARGET-host private provider vault
#     ingress_network: existing-https-proxy # only control joins; no raw published ports
#     health_url: https://review.example.invalid/health # same approved origin as webhook
#     control_env_file: /home/fleet/.config/fleet/project/control.env # CLIENT-local 0600
#     runner_env_file: /home/fleet/.config/fleet/project/runner.env
#     broker_env_file: /home/fleet/.config/fleet/project/broker.env
#     gateway_env_file: /home/fleet/.config/fleet/project/gateway.env
# Existing App slug/id/installation_id and ruleset.id are verified receipts,
# not guessed replacement targets. See docs/MAIN.md Review Bot onboarding.
# Urgency is advisory, never authentication or additional authority.
# Native Orca delivers these as question with an explicit [urgent] subject.
urgent:
  events: [provider_stalled, idle, wrong_model, stray_worktree, merge_group_failure, pr_stuck, stalled, main_down]
  # [] keeps every relay ordinary status. Comment churn does not reset this timer.
  pr_stuck_minutes: 45
status:
  url: ''
  token_env: FLEET_STATUS_TOKEN
  push_seconds: 300
hooks: {}
